name: Publicar BRAFLIX Android
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Ex.: 1.0.0 (primeira), 1.1.0 (segunda)'
        required: true
        type: string
      version_code:
        description: 'Número inteiro crescente: 1, 2, 3...'
        required: true
        type: number
      release_notes:
        description: 'O que mudou?'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      BRAFLIX_KEYSTORE_PASSWORD: ${{ secrets.BRAFLIX_KEYSTORE_PASSWORD }}
      BRAFLIX_KEY_ALIAS: ${{ secrets.BRAFLIX_KEY_ALIAS }}
      BRAFLIX_KEY_PASSWORD: ${{ secrets.BRAFLIX_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validar entradas e segredos
        env:
          KEYSTORE_B64: ${{ secrets.BRAFLIX_KEYSTORE_BASE64 }}
          INPUT_CODE: ${{ inputs.version_code }}
          INPUT_NAME: ${{ inputs.version_name }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$BRAFLIX_KEYSTORE_PASSWORD" && test -n "$BRAFLIX_KEY_ALIAS" && test -n "$BRAFLIX_KEY_PASSWORD" || { echo 'Configure os 4 segredos da assinatura.'; exit 1; }
          [[ "$INPUT_CODE" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$INPUT_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/braflix-release.jks"
          echo "BRAFLIX_KEYSTORE_FILE=$RUNNER_TEMP/braflix-release.jks" >> "$GITHUB_ENV"
      - name: Compilar APK release assinado
        env:
          INPUT_CODE: ${{ inputs.version_code }}
          INPUT_NAME: ${{ inputs.version_name }}
        run: |
          gradle --no-daemon :app:assembleRelease \
            -PbraflixVersionCode="$INPUT_CODE" \
            -PbraflixVersionName="$INPUT_NAME" \
            -PbraflixUpdateFeed="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/update.json"
          cp app/build/outputs/apk/release/app-release.apk "BRAFLIX-v${INPUT_NAME}.apk"
      - name: Publicar APK no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_NAME: ${{ inputs.version_name }}
          NOTES: ${{ inputs.release_notes }}
        run: |
          gh release create "v${INPUT_NAME}" "BRAFLIX-v${INPUT_NAME}.apk" --title "BRAFLIX v${INPUT_NAME}" --notes "$NOTES"
      - name: Gerar manifesto update.json
        env:
          INPUT_CODE: ${{ inputs.version_code }}
          INPUT_NAME: ${{ inputs.version_name }}
          NOTES: ${{ inputs.release_notes }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p site
          python3 - <<'PYGEN'
          import json,hashlib,os
          name=os.environ['INPUT_NAME']; filename=f'BRAFLIX-v{name}.apk'
          with open(filename,'rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          data={'versionCode':int(os.environ['INPUT_CODE']), 'versionName':name,
                'notes':os.environ['NOTES'], 'apkUrl':f'https://github.com/{os.environ["REPO"]}/releases/download/v{name}/{filename}', 'sha256':digest}
          with open('site/update.json','w',encoding='utf-8') as f:json.dump(data,f,ensure_ascii=False,indent=2)
          PYGEN
      - name: Publicar manifesto no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: true
      - uses: actions/upload-artifact@v4
        with:
          name: BRAFLIX-apk-${{ inputs.version_name }}
          path: BRAFLIX-v${{ inputs.version_name }}.apk
